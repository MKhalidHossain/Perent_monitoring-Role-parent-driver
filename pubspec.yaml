name: bbpool
description: A Flutter app for school carpool management with real-time tracking

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  provider: ^6.1.1
  http: ^1.1.0
  shared_preferences: ^2.2.2
  image_picker: ^1.0.4
  cached_network_image: ^3.3.0
  flutter_svg: ^2.0.9
  flutter_animate: ^4.5.0
  pin_code_fields: ^8.0.1
  flutter_otp_text_field: ^1.1.0
  email_otp: ^3.0.2
  audioplayers: ^5.2.1
  google_maps_flutter: ^2.14.0
  flutter_polyline_points: ^3.0.1
  location: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/sounds/
